# Static checks include KDKMP name extraction, category labeling, generated portal JS, and APK packaging.
name: Build AgriAttend APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'AgriAttend-Android-Ready-v*.zip'
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android compile platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AgriAttend-Android-Ready-v*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            rm -rf source
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
            PROJECT_DIR=source
          elif [ -f "settings.gradle" ] && [ -d "app" ]; then
            PROJECT_DIR=.
          else
            echo "::error::Upload ZIP AgriAttend-Android-Ready-v1.7.0.zip ke root repository."
            exit 1
          fi
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/app.js"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Static source checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          node --check app/src/main/assets/app.js
          python3 - <<'PY'
          import textwrap, xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          gradle = open('app/build.gradle', encoding='utf-8').read()
          assert "versionCode 36" in gradle and "versionName '1.7.7'" in gradle
          native = open('app/src/main/java/id/agriattend/app/SimkopdesVervalActivity.java', encoding='utf-8').read()
          assert native.count("run().catch(error=>") == 1, "Verval automation runner must be declared exactly once"
          assert "webView.setVisibility(View.VISIBLE)" in native
          assert "LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f" in native
          assert 'https://simkopdes.go.id/pers/asset/verval";' in native
          assert "batch_verification=1%2C2%2C3%2C4" not in native
          assert "const regency = %s;" in native and "const subdistrict = %s;" in native
          assert "const assignmentSearchName = %s;" in native
          assert "chooseRegion(subdistrict,'subdistrict',[p.select,d.select])" in native
          assert "kecamatan|kec" in native
          assert "const name=at(nameIndex);" in native
          assert "assetCount:Number.isFinite(parsedCount)&&parsedCount>=0?parsedCount:null" in native
          assert "assetCount:Number.isFinite(parsedCount)&&parsedCount>0?parsedCount:1" not in native
          assert "Kecamatan '+subdistrict+' tidak ditemukan" not in native
          assert "if(!wanted || wanted.length<3) return null;" in native
          assert ".filter(item=>item.label.length>=3)" in native
          assert "function applyAssignmentSearch()" in native
          assert "assignmentSearchName" in native
          assert "const maxPagesPerCategory=12" in native
          assert "entries.sort((a,b)=>(a.label==='Non Prioritas'?-1:0)" in native
          marker = 'return String.format(Locale.ROOT, """'
          assert marker in native, 'Verval JavaScript text block not found'
          script = native.split(marker, 1)[1].split('""",', 1)[0]
          script = textwrap.dedent(script).replace('\\\\', '\\').replace('%s', '"test"')
          open('/tmp/verval-automation-check.js', 'w', encoding='utf-8').write(script)
          app = open('app/src/main/assets/app.js', encoding='utf-8').read()
          assert "function armVervalWatchdog()" in app
          assert "function getFriendlyVervalError(result)" in app
          assert "assetStatusIndex=findIndex(/status data aset|status aset|kondisi aset/)" in native
          assert "replace(/\\\\s+/g,' ').trim()" in app
          assert "replace(/\\\\\\\\s+/g,' ').trim()" not in app
          assert "const message=getFriendlyVervalError(result);" in app
          assert "Diagnostik: '+summaries" not in app
          assert "matched.ownership||'Belum tersedia'" in app
          assert "matched.ownership||matched.assetStatus" not in app
          assert "assetCount:Number(x.assetCount||1)" not in app
          assert "function normalizeRegionName(value){return normalizeRegionText(value);}" in app
          assert "function normalizeRegionText(value)" in app
          assert "provinsi|province" in app and "district|subdistrict" in app
          assert "const CLIENT_VERSION = '1.7.7';" in app
          assert "function getPlacementKopdesSearchName()" in app
          assert "const hasKopdesMarker=" in app
          assert "placeholder.test(v)" in app
          assert "async function ensureSessionAvailable()" in app
          assert "await ensureSessionAvailable()" in app
          restore = app.split("async function restoreSession()", 1)[1].split("function logout()", 1)[0]
          assert "AndroidBridge.clearSecureSession" not in restore
          assert "Akun AgriConnect tetap tersimpan." in restore
          sw = open('app/src/main/assets/sw.js', encoding='utf-8').read()
          assert "agriattend-shell-v1.7.7" in sw
          assert "self.skipWaiting()" in sw and "self.clients.claim()" in sw
          assert "return tokens.slice(-2).join(' ')" in app
          assert "parts.slice(1,-2).join(' ')" in app
          assert "const subdistrictKeys=" in app
          assert "placement.kecamatan" in app
          assert "startSimkopdesVervalAutomation(provinceName,regencyName,subdistrictName,assignment,searchName)" in app
          assert "function getVervalCategoryLabel(record)" in app
          assert "function levenshteinDistance(a,b)" in app
          assert "function fuzzyKopdesNameScore(candidate,name)" in app
          assert "Masuk: ${category}" in app
          assert "},100000);" in app
          assert "state.vervalRecords=[matched]" in app and "renderVervalPage();" in app
          html = open('app/src/main/assets/index.html', encoding='utf-8').read()
          assert "Lokasi kerja tersimpan" not in html and "statLocations" not in html
          assert 'id="vervalSubdistrictSelect"' in html
          assert "© ikhwan_effect" in html
          css = open('app/src/main/assets/styles.css', encoding='utf-8').read()
          assert ".app-credit" in css
          assert "repeat(2,minmax(0,1fr))" in css
          import re
          ui_text = html + app
          assert not re.search(r"\\bAI\\b|artificial intelligence|kecerdasan buatan|berbasis AI|asisten AI", ui_text, re.I)
          assert "state.vervalMatchState='error'" in app
          print('Manifest, version, generated Verval script, viewport, callback rendering, and watchdog checks OK')
          PY
          node --check /tmp/verval-automation-check.js

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriAttend-debug-APK-v1.7.7
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
