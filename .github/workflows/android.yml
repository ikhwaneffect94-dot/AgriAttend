name: Build AgriAttend APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AgriAttend-Android-Ready-v*.zip'
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android compile platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AgriAttend-Android-Ready-v*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            rm -rf source
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
            PROJECT_DIR=source
          elif [ -f "settings.gradle" ] && [ -d "app" ]; then
            PROJECT_DIR=.
          else
            echo "::error::Upload ZIP AgriAttend-Android-Ready-v1.5.3.zip ke root repository."
            exit 1
          fi
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/app.js"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriAttend-debug-APK-v1.5.3
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
