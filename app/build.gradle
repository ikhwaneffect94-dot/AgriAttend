plugins {
    id 'com.android.application'
}

android {
    namespace 'id.agriattend.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.agriattend.app'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '1.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
